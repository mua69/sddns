# nginx reverse proxy for sddns with TLS and rate limiting.
#
# Install: copy to /etc/nginx/conf.d/sddns.conf (files there are included in
# the http context), adjust server_name, certificates and the sddns port, then
#   nginx -t && systemctl reload nginx

# Rate limit per client IP: 6 requests per minute on average.
# 1 MB of shared memory tracks about 16,000 client addresses.
limit_req_zone $binary_remote_addr zone=sddns:1m rate=6r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ddns.example.org;

    ssl_certificate     /etc/letsencrypt/live/ddns.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ddns.example.org/privkey.pem;

    # The query string contains the client password: never write it to disk.
    access_log off;

    location = /update {
        # Allow short bursts (retries, separate IPv4/IPv6 updates), reject
        # anything beyond immediately with 429 Too Many Requests.
        limit_req zone=sddns burst=5 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;

        proxy_pass http://127.0.0.1:3200;

        # Always overwrite the header, so clients cannot inject a fake IP.
        # sddns logs this address (TrustProxy, on by default).
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else: not found, so scanners never reach sddns.
    location / {
        return 404;
    }
}
