# fail2ban filter for sddns.
#
# Matches failed and malformed update requests in the sddns log, e.g.:
#   time=... level=ERROR msg="invalid fqdn or passphrase" fqdn=home.example.org client=198.51.100.23
#
# The client IP is the last field of these lines. Anchoring <HOST> at the end
# of the line keeps a crafted fqdn value from injecting a different address
# (sddns quotes values containing spaces or '=').
#
# Install: copy to /etc/fail2ban/filter.d/sddns.conf
# Test:    fail2ban-regex systemd-journal[journalflags=1] /etc/fail2ban/filter.d/sddns.conf

[Definition]

failregex = level=ERROR msg="invalid fqdn or passphrase" fqdn=.* client=<HOST>$
            level=ERROR msg="request without passphrase" fqdn=.* client=<HOST>$
            level=ERROR msg="request without fqdn" client=<HOST>$

ignoreregex =
