# fail2ban jail for sddns.
#
# Bans client IPs with repeated failed update requests on the HTTP(S) ports,
# where nginx accepts them. Requires TrustProxy (on by default) so sddns logs
# the real client IP instead of 127.0.0.1.
#
# Assumes sddns runs as the systemd unit sddns.service and logs to the journal.
# If it logs to a file instead, replace backend/journalmatch with:
#   logpath = /var/log/sddns.log
#
# Install: copy to /etc/fail2ban/jail.d/sddns.conf, then
#   systemctl reload fail2ban
#   fail2ban-client status sddns

[sddns]
enabled      = true
filter       = sddns
backend      = systemd
journalmatch = _SYSTEMD_UNIT=sddns.service
port         = http,https

# 5 failures within 10 minutes -> banned for 1 hour
maxretry     = 5
findtime     = 10m
bantime      = 1h
